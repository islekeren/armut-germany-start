services:
  postgres:
    image: postgres:16-alpine
    container_name: armut-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: armut
      POSTGRES_PASSWORD: armut123
      POSTGRES_DB: armut_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U armut -d armut_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: armut-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: armut-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://armut:armut123@postgres:5432/armut_db?schema=public
      JWT_SECRET: local-docker-access-secret
      JWT_REFRESH_SECRET: local-docker-refresh-secret
      PORT: 4000
      NODE_ENV: development
      CORS_ORIGINS: http://localhost:3000,http://web:3000
      REDIS_URL: redis://redis:6379
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
      STRIPE_CONNECT_RETURN_URL: http://localhost:3000/dashboard/finances?stripe=return
      STRIPE_CONNECT_REFRESH_URL: http://localhost:3000/dashboard/finances?stripe=refresh
      STRIPE_CHECKOUT_SUCCESS_URL: http://localhost:3000/bookings/{bookingId}?payment=success
      STRIPE_CHECKOUT_CANCEL_URL: http://localhost:3000/bookings/{bookingId}?payment=cancel
      PLATFORM_COMMISSION_RATE: 0.15
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      - root_node_modules:/app/node_modules
      - api_node_modules:/app/apps/api/node_modules
    command: >
      sh -c "npm --workspace=api run db:generate &&
             npm --workspace=api run db:migrate &&
             npm --workspace=api run db:seed &&
             npm run dev:api"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: armut-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      API_URL: http://api:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_TELEMETRY_DISABLED: 1
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - root_node_modules:/app/node_modules
      - web_node_modules:/app/apps/web/node_modules
      - web_next:/app/apps/web/.next
    command: npm run dev:web

volumes:
  postgres_data:
  redis_data:
  root_node_modules:
  api_node_modules:
  web_node_modules:
  web_next:
